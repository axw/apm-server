apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-frontend
  labels:
    app: apm-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apm-frontend
  template:
    metadata:
      labels:
        app: apm-frontend
    spec:
      containers:
      - name: apm-frontend
        image: apm-frontend
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8200
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        args:
        - "--broker=kafka.kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: apm-frontend
spec:
  selector:
    app: apm-frontend
  ports:
  - name: apm-frontend
    protocol: TCP
    port: 8200
    #targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-backend
  labels:
    app: apm-backend
spec:
  selector:
    matchLabels:
      app: apm-backend
  template:
    metadata:
      labels:
        app: apm-backend
    spec:
      containers:
      - name: apm-backend
        image: apm-backend
        imagePullPolicy: IfNotPresent
        args:
        - "--broker=kafka.kafka:9092"
        env:
        -  name: ELASTICSEARCH_URL
           value: https://es-es-http:9200
        -  name: ELASTICSEARCH_USER
           value: elastic
        -  name: ELASTICSEARCH_PASSWORD
           valueFrom:
             secretKeyRef:
               name: es-es-elastic-user
               key: elastic
               optional: false
        volumeMounts:
        - name: escerts
          mountPath: "/etc/escerts"
      volumes:
      - name: escerts
        secret:
          secretName: es-es-http-certs-public
          optional: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-txmetrics
  labels:
    app: apm-txmetrics
spec:
  selector:
    matchLabels:
      app: apm-txmetrics
  template:
    metadata:
      labels:
        app: apm-txmetrics
    spec:
      containers:
      - name: apm-txmetrics
        image: apm-txmetrics
        imagePullPolicy: IfNotPresent
        args:
        - "--broker=kafka.kafka:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-destmetrics
  labels:
    app: apm-destmetrics
spec:
  selector:
    matchLabels:
      app: apm-destmetrics
  template:
    metadata:
      labels:
        app: apm-destmetrics
    spec:
      containers:
      - name: apm-destmetrics
        image: apm-destmetrics
        imagePullPolicy: IfNotPresent
        args:
        - "--broker=kafka.kafka:9092"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: apm-backend-scaledobject
spec:
  scaleTargetRef:
    name: apm-backend
  pollingInterval: 10
  cooldownPeriod: 10
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka.kafka:9092
      consumerGroup: apm-backend
      topic: elastic-apm-events
      lagThreshold: "5"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: apm-txmetrics-scaledobject
spec:
  scaleTargetRef:
    name: apm-txmetrics
  pollingInterval: 10
  cooldownPeriod: 10
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka.kafka:9092
      consumerGroup: apm-txmetrics
      topic: apm-grouped-transactions
      lagThreshold: "5"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: apm-destmetrics-scaledobject
spec:
  scaleTargetRef:
    name: apm-destmetrics
  pollingInterval: 10
  cooldownPeriod: 10
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka.kafka:9092
      consumerGroup: apm-destmetrics
      topic: apm-destmetrics-events
      lagThreshold: "5"
