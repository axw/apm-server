---
name: Label checks
on:
  pull_request:
    types: [opened, labeled, unlabeled]
    branches: [main, master]

jobs:
  check_labels:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v2
        with:
            go-version: 1.17.x
      - name: Checkout
        uses: actions/checkout@v2
      - name: Check labels
        run: cd ./.github/workflows/check_labels && go run .
