apiVersion: v1
kind: Secret
metadata:
  name: admin-basic-auth
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: changeme
  roles: superuser
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
spec:
  version: 8.4.0
  image: docker.elastic.co/elasticsearch/elasticsearch:8.4.0-60171339-SNAPSHOT
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  auth:
    fileRealm:
      - secretName: admin-basic-auth
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
spec:
  version: 8.4.0
  image: kibana
  count: 1
  elasticsearchRef:
    name: elasticsearch
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  config:
    xpack.fleet.packages:
    - name: apm
      version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-server
    spec:
      containers:
      - name: apm-server
        image: apm-server
        args:
        - -E
        - output.elasticsearch.hosts=[elasticsearch-es-http:9200]
        - -E
        - output.elasticsearch.username=admin
        - -E
        - output.elasticsearch.password=changeme
        ports:
        - containerPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: apm-server
spec:
  selector:
    app.kubernetes.io/name: apm-server
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200
