apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: es
spec:
  version: 8.1.3
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
spec:
  version: 8.1.3
  count: 1
  elasticsearchRef:
    name: es
  config:
    xpack.fleet.packages:
    - name: apm
      version: latest
    - name: kafka
      version: latest
    - name: kubernetes
      version: latest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
rules:
- apiGroups: [""] # "" indicates the core API group
  resources:
  - namespaces
  - pods
  - nodes
  - nodes/metrics
  - nodes/proxy
  - nodes/stats
  - events
  verbs:
  - get
  - watch
  - list
- nonResourceURLs:
  - /metrics
  verbs:
  - get
  - watch
  - list
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs:
  - get
  - create
  - update
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
subjects:
- kind: ServiceAccount
  name: elastic-agent
  namespace: default
roleRef:
  kind: ClusterRole
  name: elastic-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: elastic-agent
spec:
  version: 8.0.0
  elasticsearchRefs:
  - name: es
  daemonSet:
    podTemplate:
      spec:
        automountServiceAccountToken: true
        serviceAccountName: elastic-agent
        containers:
        - name: agent
          securityContext:
            runAsUser: 0
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
  config:
    id: 488e0b80-3634-11eb-8208-57893829af4e
    revision: 2
    agent:
      monitoring:
        enabled: true
        use_output: default
        logs: true
        metrics: true
    inputs:
    - id: logfile-kafka-8b745fb2-87b7-4102-8f16-249c0dafd1a1
      name: kafka-1
      revision: 2
      type: logfile
      use_output: default
      meta:
        package:
          name: kafka
          version: 1.2.2
      data_stream:
        namespace: default
      streams:
        - id: logfile-kafka.log-8b745fb2-87b7-4102-8f16-249c0dafd1a1
          data_stream:
            dataset: kafka.log
            type: logs
          exclude_files:
            - .gz$
          paths:
            - /opt/kafka*/logs/controller.log*
            - /opt/kafka*/logs/server.log*
            - /opt/kafka*/logs/state-change.log*
            - /opt/kafka*/logs/kafka-*.log*
          multiline:
            negate: true
            pattern: '^\['
            match: after
          processors:
            - add_locale: null
          tags:
            - kafka-log
    - id: kafka/metrics-kafka-8b745fb2-87b7-4102-8f16-249c0dafd1a1
      name: kafka-1
      revision: 2
      type: kafka/metrics
      use_output: default
      meta:
        package:
          name: kafka
          version: 1.2.2
      data_stream:
        namespace: default
      streams:
        - id: kafka/metrics-kafka.consumergroup-8b745fb2-87b7-4102-8f16-249c0dafd1a1
          data_stream:
            dataset: kafka.consumergroup
            type: metrics
          period: 10s
          hosts:
            - 'kafka.kafka:9092'
          metricsets:
            - consumergroup
        - id: kafka/metrics-kafka.partition-8b745fb2-87b7-4102-8f16-249c0dafd1a1
          data_stream:
            dataset: kafka.partition
            type: metrics
          period: 10s
          hosts:
            - 'kafka.kafka:9092'
          metricsets:
            - partition
